name: Build-OpenWrt-EasyTier

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (optional v prefix; leave empty to build only)'
        required: false
        default: ''
        type: string
      verify_signed_indexes:
        description: 'Verify signed package indexes without publishing a release'
        required: true
        default: false
        type: boolean
      text:
        description: 'Release notes'
        required: false
        default: ''
        type: string
      architecture:
        description: 'Select one architecture; release publishing requires all'
        required: true
        type: choice
        default: all
        options:
          - all
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_generic
          - arm_arm1176jzf-s_vfp
          - arm_arm926ej-s
          - arm_cortex-a15_neon-vfpv4
          - arm_cortex-a5_vfpv4
          - arm_cortex-a7
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a8_vfpv3
          - arm_cortex-a9
          - arm_cortex-a9_neon
          - arm_cortex-a9_vfpv3-d16
          - arm_fa526
          - arm_xscale
          - mips_24kc
          - mips_mips32
          - mipsel_24kc
          - mipsel_24kc_24kf
          - mipsel_74kc
          - mipsel_mips32
          - x86_64

permissions:
  contents: read

jobs:
  validate:
    name: Validate build selection and release tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.selection.outputs.release_tag }}
      architectures: ${{ steps.selection.outputs.architectures }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - id: selection
        name: Validate build selection and release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_ARCH: ${{ inputs.architecture }}
          VERIFY_SIGNED_INDEXES: ${{ inputs.verify_signed_indexes }}
          OPKG_FEED_SIGNING_KEY: ${{ secrets.OPKG_FEED_SIGNING_KEY }}
          APK_FEED_SIGNING_KEY: ${{ secrets.APK_FEED_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG" ]]; then
            case "$RELEASE_TAG" in
              *[!A-Za-z0-9._+-]*)
                echo "::error::Tag contains unsupported characters."
                exit 1
                ;;
            esac
            requested_version="${RELEASE_TAG#v}"
            expected_version="$(awk -F= '$1 == "LUCI_APP_VERSION" { print $2; exit }' version.mk)"
            if [[ "$requested_version" != "$expected_version" ]]; then
              echo "::error::Tag version $requested_version does not match LuCI app version $expected_version."
              exit 1
            fi
            if [[ "$BUILD_ARCH" != all ]]; then
              echo "::error::Release publishing requires architecture=all."
              exit 1
            fi
          fi
          if [[ -n "$RELEASE_TAG" || "$VERIFY_SIGNED_INDEXES" == "true" ]]; then
            if [[ -z "$OPKG_FEED_SIGNING_KEY" || -z "$APK_FEED_SIGNING_KEY" ]]; then
              echo "::error::Signed feed verification requires OPKG_FEED_SIGNING_KEY and APK_FEED_SIGNING_KEY repository secrets."
              exit 1
            fi
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          python3 - "$BUILD_ARCH" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          all_arches = [
              "aarch64_cortex-a53",
              "aarch64_cortex-a72",
              "aarch64_generic",
              "arm_arm1176jzf-s_vfp",
              "arm_arm926ej-s",
              "arm_cortex-a15_neon-vfpv4",
              "arm_cortex-a5_vfpv4",
              "arm_cortex-a7",
              "arm_cortex-a7_neon-vfpv4",
              "arm_cortex-a8_vfpv3",
              "arm_cortex-a9",
              "arm_cortex-a9_neon",
              "arm_cortex-a9_vfpv3-d16",
              "arm_fa526",
              "arm_xscale",
              "mips_24kc",
              "mips_mips32",
              "mipsel_24kc",
              "mipsel_24kc_24kf",
              "mipsel_74kc",
              "mipsel_mips32",
              "x86_64",
          ]
          requested = sys.argv[1]
          if requested == "all":
              selected = all_arches
          elif requested in all_arches:
              selected = [requested]
          else:
              raise SystemExit(f"Unsupported architecture: {requested}")

          with open(sys.argv[2], "a", encoding="utf-8") as output:
              output.write("architectures=" + json.dumps(selected, separators=(",", ":")) + "\n")
          PY

  build:
    name: Build ${{ matrix.arch }}-${{ matrix.sdk }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.validate.outputs.architectures) }}
        sdk:
          - 24.10.8
          - 25.12.5
          - SNAPSHOT
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Build packages with OpenWrt SDK
        uses: openwrt/gh-action-sdk@f5813d30eeef3534b58ac7e79c5d8842b6035434
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEEDNAME: packages_ci
          # luci.mk emits the i18n package while building luci-app-easytier; it has no download target.
          PACKAGES: easytier easytier-noweb luci-app-easytier
          INDEX: 1
          KEY_BUILD: ${{ secrets.OPKG_FEED_SIGNING_KEY }}
          PRIVATE_KEY: ${{ secrets.APK_FEED_SIGNING_KEY }}
          NO_REFRESH_CHECK: 1
          V: s
      - name: Verify package outputs and generate SDK-specific guide
        env:
          PACKAGE_DIR: bin/packages/${{ matrix.arch }}/packages_ci
          BUILD_TARGET: ${{ matrix.arch }}-${{ matrix.sdk }}
          SDK: ${{ matrix.sdk }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: .github/scripts/prepare-package-artifacts.sh
      - name: Verify signed stable package indexes
        if: ${{ (needs.validate.outputs.release_tag != '' || inputs.verify_signed_indexes) && matrix.sdk != 'SNAPSHOT' }}
        env:
          PACKAGE_DIR: ${{ github.workspace }}/bin/packages/${{ matrix.arch }}/packages_ci
          SDK: ${{ matrix.sdk }}
        run: .github/scripts/verify-package-index.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.arch }}-${{ matrix.sdk }}
          path: bin/packages/${{ matrix.arch }}/packages_ci/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Release
    needs:
      - validate
      - build
    if: ${{ needs.validate.outputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-${{ needs.validate.outputs.release_tag }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts
      - name: Package and checksum release archives
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release
          artifact_dirs=(artifacts/*)
          [[ ${#artifact_dirs[@]} -eq 66 ]] || {
            echo "::error::Expected 66 build artifacts, found ${#artifact_dirs[@]}."
            exit 1
          }
          archives=()
          for dir in "${artifact_dirs[@]}"; do
            name="${dir##*/}"
            case "$name" in
              *-24.10.8) extension=ipk; package_separator=_ ;;
              *-25.12.5|*-SNAPSHOT) extension=apk; package_separator=- ;;
              *) echo "::error::Unknown SDK in artifact $name."; exit 1 ;;
            esac
            packages=("$dir"/*."$extension")
            guide="$dir/README_PACKAGE.md"
            [[ -f "$guide" ]] || {
              echo "::error::Missing package guide in $name."
              exit 1
            }
            for prefix in easytier easytier-noweb luci-app-easytier luci-i18n-easytier-zh-cn; do
              matches=("$dir/$prefix$package_separator"*."$extension")
              [[ ${#matches[@]} -gt 0 ]] || {
                echo "::error::Missing $prefix *.$extension package in $name."
                exit 1
              }
            done
            archive="release/EasyTier-$RELEASE_TAG-$name.zip"
            zip -j -q "$archive" "${packages[@]}" "$guide"
            unzip -Z1 "$archive" | grep -q "\\.$extension$" || {
              echo "::error::Archive $archive has no .$extension packages."
              exit 1
            }
            archives+=("$archive")
          done
          [[ ${#archives[@]} -eq 66 ]] || {
            echo "::error::Expected 66 release archives, found ${#archives[@]}."
            exit 1
          }
          (cd release && sha256sum ./*.zip > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Assemble stable feeds for GitHub Pages
        run: .github/scripts/assemble-feed-site.sh artifacts site
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.validate.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          body: |
            - OpenWrt 24.10 packages use .ipk and opkg.
            - OpenWrt 25.12 and Snapshot packages use .apk and apk.
            - Each architecture/SDK ZIP includes the matching installation guide.
            - Verify downloads with sha256sum -c SHA256SUMS.
            ${{ inputs.text }}
          files: |
            release/*.zip
            release/SHA256SUMS
          fail_on_unmatched_files: true

  deploy-pages:
    name: Deploy package feeds to GitHub Pages
    needs:
      - validate
      - release
    if: ${{ needs.validate.outputs.release_tag != '' && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy package feed site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
