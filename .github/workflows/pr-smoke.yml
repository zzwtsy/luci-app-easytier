name: OpenWrt PR Smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Static and regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Check shell syntax
        run: |
          set -euo pipefail
          mapfile -t scripts < <(rg --files luci-app-easytier/root/etc/init.d luci-app-easytier/root/etc/uci-defaults luci-app-easytier/root/usr/libexec luci-app-easytier/root/usr/share/easytier)
          for script in "${scripts[@]}"; do
            bash -n "$script"
            if head -n 1 "$script" | grep -qE '^#!/bin/sh([[:space:]]|$)'; then
              sh -n "$script"
            fi
          done
          for script in tests/*.sh .github/scripts/*.sh; do bash -n "$script"; done
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          mapfile -t scripts < <(rg --files luci-app-easytier/htdocs -g '*.js')
          for script in "${scripts[@]}"; do node --check "$script"; done
      - name: Parse JSON and ACL files
        run: |
          python3 -m json.tool luci-app-easytier/root/usr/share/rpcd/acl.d/luci-app-easytier.json >/dev/null
          python3 -m json.tool luci-app-easytier/root/usr/share/luci/menu.d/luci-app-easytier.json >/dev/null
      - name: Check translations
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gettext
          msgfmt --check --check-header -o /dev/null luci-app-easytier/po/zh_Hans/easytier.po
          msgfmt --check-format -o /dev/null luci-app-easytier/po/templates/easytier.pot
      - name: Check architecture mappings
        run: tests/check-arch-mapping.sh
      - name: Check ARM release ABI
        run: .github/scripts/check-arm-abi.sh
      - name: Test firewall configuration
        run: tests/firewall.sh

  build-smoke:
    name: Build smoke x86_64-${{ matrix.sdk }}
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        sdk:
          - 24.10.8
          - 25.12.5
          - SNAPSHOT
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Build packages with OpenWrt SDK
        uses: openwrt/gh-action-sdk@f5813d30eeef3534b58ac7e79c5d8842b6035434
        env:
          ARCH: x86_64-${{ matrix.sdk }}
          FEEDNAME: packages_ci
          # luci.mk emits the i18n package while building luci-app-easytier; it has no download target.
          PACKAGES: easytier easytier-noweb luci-app-easytier
          NO_REFRESH_CHECK: 1
          V: s
      - name: Verify package outputs
        env:
          PACKAGE_DIR: bin/packages/x86_64/packages_ci
          BUILD_TARGET: x86_64-${{ matrix.sdk }}
          REQUIRE_PACKAGE_INDEX: 0
          SDK: ${{ matrix.sdk }}
        run: .github/scripts/prepare-package-artifacts.sh

  build:
    name: Build ${{ matrix.arch }}-${{ matrix.sdk }}
    needs: build-smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_generic
          - arm_arm926ej-s
          - arm_arm1176jzf-s_vfp
          - arm_cortex-a7
          - arm_cortex-a7_neon-vfpv4
          - mips_24kc
          - mipsel_24kc
        sdk:
          - 24.10.8
          - 25.12.5
          - SNAPSHOT
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Build packages with OpenWrt SDK
        uses: openwrt/gh-action-sdk@f5813d30eeef3534b58ac7e79c5d8842b6035434
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEEDNAME: packages_ci
          # luci.mk emits the i18n package while building luci-app-easytier; it has no download target.
          PACKAGES: easytier easytier-noweb luci-app-easytier
          NO_REFRESH_CHECK: 1
          V: s
      - name: Verify package outputs
        env:
          PACKAGE_DIR: bin/packages/${{ matrix.arch }}/packages_ci
          BUILD_TARGET: ${{ matrix.arch }}-${{ matrix.sdk }}
          REQUIRE_PACKAGE_INDEX: 0
          SDK: ${{ matrix.sdk }}
        run: .github/scripts/prepare-package-artifacts.sh
