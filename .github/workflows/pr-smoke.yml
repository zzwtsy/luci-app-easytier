name: OpenWrt PR Smoke

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static and regression checks
    runs-on: ubuntu-latest
    outputs:
      priority_matrix: ${{ steps.priority.outputs.build_matrix }}
      remaining_matrix: ${{ steps.remaining.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install static-check tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gettext shellcheck
      - name: Install development dependencies
        run: npm ci
      - name: Run common checks
        run: npm run check
      - id: priority
        name: Generate priority smoke matrix
        run: python3 scripts/build_targets.py matrix --kind pr-priority --github-output "$GITHUB_OUTPUT"
      - id: remaining
        name: Generate remaining smoke matrix
        run: python3 scripts/build_targets.py matrix --kind pr-remaining --github-output "$GITHUB_OUTPUT"
      - name: Check ARM release ABI
        run: .github/scripts/check-arm-abi.sh

  build-smoke:
    name: Build smoke ${{ matrix.arch }}-${{ matrix.sdk }}
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.checks.outputs.priority_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Build packages with OpenWrt SDK
        uses: openwrt/gh-action-sdk@f5813d30eeef3534b58ac7e79c5d8842b6035434
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEEDNAME: packages_ci
          # luci.mk emits the i18n package while building luci-app-easytier; it has no download target.
          PACKAGES: easytier easytier-noweb luci-app-easytier
          NO_REFRESH_CHECK: 1
          V: s
      - name: Verify package outputs
        env:
          PACKAGE_DIR: bin/packages/${{ matrix.arch }}/packages_ci
          BUILD_TARGET: ${{ matrix.arch }}-${{ matrix.sdk }}
          REQUIRE_PACKAGE_INDEX: 0
          SDK: ${{ matrix.sdk }}
        run: .github/scripts/prepare-package-artifacts.sh

  build:
    name: Build ${{ matrix.arch }}-${{ matrix.sdk }}
    needs:
      - checks
      - build-smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.checks.outputs.remaining_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Build packages with OpenWrt SDK
        uses: openwrt/gh-action-sdk@f5813d30eeef3534b58ac7e79c5d8842b6035434
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEEDNAME: packages_ci
          # luci.mk emits the i18n package while building luci-app-easytier; it has no download target.
          PACKAGES: easytier easytier-noweb luci-app-easytier
          NO_REFRESH_CHECK: 1
          V: s
      - name: Verify package outputs
        env:
          PACKAGE_DIR: bin/packages/${{ matrix.arch }}/packages_ci
          BUILD_TARGET: ${{ matrix.arch }}-${{ matrix.sdk }}
          REQUIRE_PACKAGE_INDEX: 0
          SDK: ${{ matrix.sdk }}
        run: .github/scripts/prepare-package-artifacts.sh
