<!doctype html>
<html lang="zh-Hans">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light dark">
	<title>EasyTier OpenWrt 软件源</title>
	<style>
		:root {
			--bg: #f2f6f5;
			--ink: #1b2a2d;
			--muted: #57707a;
			--accent: #0e7490;
			--accent-strong: #0a5a70;
			--line: #d9e3e2;
			--code-bg: #e4edec;
		}

		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #0f1718;
				--ink: #dce8ea;
				--muted: #8ba3a8;
				--accent: #57c3da;
				--accent-strong: #7fd4e6;
				--line: #26363b;
				--code-bg: #1b2a2e;
			}
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 2rem 1.25rem;
			background: var(--bg);
			color: var(--ink);
			font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
			font-size: 1rem;
			line-height: 1.7;
		}

		.page {
			width: 100%;
			max-width: 42rem;
		}

		header {
			position: relative;
			padding-bottom: 1.5rem;
			margin-bottom: 1.5rem;
			border-bottom: 1px solid var(--line);
		}

		h1 {
			margin: 0 0 0.75rem;
			font-size: 1.6rem;
			font-weight: 650;
		}

		.lead {
			margin: 0;
			max-width: 30em;
			font-size: 1.05rem;
		}

		main p { margin: 0 0 1rem; }

		code {
			font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
			font-size: 0.9em;
			padding: 0.1em 0.4em;
			border-radius: 4px;
			background: var(--code-bg);
		}

		a {
			color: var(--accent);
			text-underline-offset: 0.18em;
		}

		a:hover { color: var(--accent-strong); }

		a:focus-visible {
			outline: 2px solid var(--accent);
			outline-offset: 2px;
			border-radius: 2px;
		}

		footer {
			margin-top: 2.5rem;
			padding-top: 1rem;
			border-top: 1px solid var(--line);
			font-size: 0.875rem;
			color: var(--muted);
		}

		.header-graphic {
			position: absolute;
			top: 50%;
			right: 0;
			width: 150px;
			transform: translateY(-50%);
			color: var(--accent);
			opacity: 0.3;
			pointer-events: none;
		}

		@media (max-width: 540px) {
			.header-graphic { display: none; }
		}
	</style>
</head>
<body>
	<div class="page">
		<header>
			<svg class="header-graphic" viewBox="0 0 200 120" aria-hidden="true" focusable="false">
				<g stroke="currentColor" stroke-width="1.5" fill="none">
					<path d="M20 60 L70 25 L125 45 L170 20 M20 60 L90 95 L175 85 M125 45 L90 95 M170 20 L175 85"/>
				</g>
				<g fill="currentColor">
					<circle cx="20" cy="60" r="5"/>
					<circle cx="70" cy="25" r="5"/>
					<circle cx="125" cy="45" r="5"/>
					<circle cx="170" cy="20" r="5"/>
					<circle cx="90" cy="95" r="5"/>
					<circle cx="175" cy="85" r="5"/>
				</g>
			</svg>
			<h1>EasyTier OpenWrt 软件源</h1>
			<p class="lead">提供 OpenWrt <code>24.10.8</code>（IPK / opkg）和 <code>25.12.5</code>（APK / apk）的签名软件包。</p>
		</header>
		<main>
			<p>请使用与设备匹配的 OpenWrt 包架构。安装步骤和更新方式见
				<a href="https://github.com/zzwtsy/luci-app-easytier#%E4%BB%8E-github-pages-%E8%BD%AF%E4%BB%B6%E6%BA%90%E5%AE%89%E8%A3%85">项目安装说明</a>。
			</p>
			<p lang="en">English: signed feeds are available for OpenWrt <code>24.10.8</code> and <code>25.12.5</code>.
				See the <a href="https://github.com/zzwtsy/luci-app-easytier#install-from-the-github-pages-package-feed">installation guide</a>.
			</p>
		</main>
		<footer>
			<a href="https://github.com/zzwtsy/luci-app-easytier">github.com/zzwtsy/luci-app-easytier</a>
		</footer>
	</div>
</body>
</html>
